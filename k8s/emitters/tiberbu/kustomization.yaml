# tibERbu emitter adaptor (https://github.com/openphc/tiberbu-cce-emitter-adaptor). Each environment deploys exactly ONE
# emitter from k8s/emitters/: the overlay lists it in resources (one-click installer: EMITTER_ADAPTOR=tiberbu, written by
# one-click-installer/lib/apply-emitter.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tiberbu-emitter-adaptor.yaml
