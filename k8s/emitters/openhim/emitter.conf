# Read by one-click-installer/lib/emitter-lib.sh. DEPLOYMENT is also the Service name and the gateway route id;
# OpenHIM posts to https://<host>/v1/<DEPLOYMENT>/inbound with HTTP Basic credentials.
DEPLOYMENT=openhim-emitter-adaptor
PORT=8082
IMAGE=ghcr.io/openphc/openhim-cce-emitter-adaptor
SOURCE=openhim
