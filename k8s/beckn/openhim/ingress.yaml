# https://<OpenHIM host>/            -> the admin console
# https://<OpenHIM host>/openhim-api -> the Core API the console calls (prefix stripped; HTTPS to Core's self-signed certificate)
# /bap/receiver and /bpp/receiver on the same host are in k8s/beckn/onix/ingress.yaml.
# The channel ports (5000/5001) are NOT published: with Beckn, events reach the channel through the emitter adaptor, in-cluster.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: openhim-core-selfsigned
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openhim-api-strip
spec:
  stripPrefix:
    prefixes:
      - /openhim-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhim-api-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
    traefik.ingress.kubernetes.io/router.middlewares: ${BECKN_OPENHIM_NAMESPACE}-openhim-api-strip@kubernetescrd
spec:
  tls:
    - hosts:
        - ${BECKN_OPENHIM_HOST}
  rules:
    - host: ${BECKN_OPENHIM_HOST}
      http:
        paths:
          - path: /openhim-api
            pathType: Prefix
            backend:
              service:
                name: openhim-core
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhim-console-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  tls:
    - hosts:
        - ${BECKN_OPENHIM_HOST}
  rules:
    - host: ${BECKN_OPENHIM_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhim-console
                port:
                  number: 80
