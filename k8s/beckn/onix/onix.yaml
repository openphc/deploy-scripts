# The Sygnal adapter (CCE profile) of ONE network participant: one container "onix-sygnal" on :8082 with one identity and
# two modules — /sygnal/receiver/ (published through ingress.yaml) and /sygnal/caller/ (in-cluster: the participant's own
# services send through http://onix-sygnal:8082/sygnal/caller) — and the participant's adapter Redis (onix-redis).
# Deployed once per participant namespace (CCE, OpenHIM, OpenMRS) by one-click-installer/install-beckn.sh. OpenMRS also
# runs a Beckn adapter pair for the Spice referrals next to it (k8s/beckn/onix-beckn), which uses the same Redis.
#
# Not in this file, created per namespace by one-click-installer/lib/beckn/beckn-deploy.sh before this is applied:
#   Secret    onix-config  — onix.yaml (it holds the signing keys), routing-receiver.yaml, routing-caller.yaml,
#                            rendered from k8s/beckn/onix/config/*.yaml                         -> /app/config
#   ConfigMap onix-sygnal-profile — cce-sygnal-apis.yaml, the CCE profile of Sygnal: the only spec  -> /app/config/sygnal
# The profile is all this adapter checks a message against: it mounts no payload schemas (profile v3.0 — the payloads are
# sygnal:CoordinationEvent / sygnal:Signal, extended in the profile, and carry no "@context"). OpenMRS's referral pair
# keeps its own schemas in ConfigMap onix-schema (k8s/beckn/onix-beckn).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onix-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onix-redis
  template:
    metadata:
      labels:
        app: onix-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # The adapter keeps only short-lived data here (registry lookups, signatures): no disk needed.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: onix-redis
spec:
  selector:
    app: onix-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onix-sygnal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onix-sygnal
  template:
    metadata:
      labels:
        app: onix-sygnal
    spec:
      containers:
        - name: onix-sygnal
          image: fidedocker/onix-adapter:1.9.4
          args: ["./server", "--config=/app/config/onix.yaml"]
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: sygnal
              mountPath: /app/config/sygnal
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: onix-config
        - name: sygnal
          configMap:
            name: onix-sygnal-profile
---
apiVersion: v1
kind: Service
metadata:
  name: onix-sygnal
spec:
  selector:
    app: onix-sygnal
  ports:
    - port: 8082
      targetPort: 8082
