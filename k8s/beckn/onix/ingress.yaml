# The public Sygnal address of one participant: https://<host>/sygnal/receiver. This is the URL in its subscriber record in
# the network registry, and the context.receiverUri its peers put in the messages they send it (onix appends the action).
# The caller (/sygnal/caller) is NOT published: only the participant's own services use it, in-cluster.
# ${BECKN_HOST} is filled per participant by one-click-installer/lib/beckn/beckn-deploy.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onix-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  tls:
    - hosts:
        - ${BECKN_HOST}
  rules:
    - host: ${BECKN_HOST}
      http:
        paths:
          - path: /sygnal/receiver
            pathType: Prefix
            backend:
              service:
                name: onix-sygnal
                port:
                  number: 8082
