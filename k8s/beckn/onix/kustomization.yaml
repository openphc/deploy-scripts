# One participant's Sygnal adapter (onix-sygnal, onix-redis) and its public Sygnal ingress (/sygnal/receiver).
# Used by k8s/beckn/cce, k8s/beckn/openhim and k8s/beckn/openmrs; config/ holds the adapter config templates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - onix.yaml
  - ingress.yaml
