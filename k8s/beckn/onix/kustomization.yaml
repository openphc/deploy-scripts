# One participant's ONIX adapter (onix-bap, onix-bpp, Redis) and its public Beckn ingress.
# Used by k8s/beckn/cce, k8s/beckn/openhim and k8s/beckn/openmrs; config/ holds the adapter config templates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - onix.yaml
  - ingress.yaml
