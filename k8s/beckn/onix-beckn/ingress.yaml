# OpenMRS's two public Beckn addresses for the Spice <-> OpenMRS health referrals: https://<host>/bap/receiver and
# https://<host>/bpp/receiver — the URLs registered for its BAP and BPP subscribers. The callers (/bap/caller, /bpp/caller)
# are NOT published. The Sygnal address (/sygnal/receiver) on the same host is in k8s/beckn/onix/ingress.yaml.
# ${BECKN_HOST} is filled by one-click-installer/lib/beckn/beckn-deploy.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onix-beckn-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  tls:
    - hosts:
        - ${BECKN_HOST}
  rules:
    - host: ${BECKN_HOST}
      http:
        paths:
          - path: /bap/receiver
            pathType: Prefix
            backend:
              service:
                name: onix-bap
                port:
                  number: 8081
          - path: /bpp/receiver
            pathType: Prefix
            backend:
              service:
                name: onix-bpp
                port:
                  number: 8082
