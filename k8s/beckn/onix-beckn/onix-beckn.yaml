# OpenMRS's Beckn adapter pair, for the Spice <-> OpenMRS health referrals ONLY (standard Beckn: select / init / confirm /
# status / update and their callbacks): onix-bap (consumer side, :8081), onix-bpp (provider side, :8082), unchanged from
# the Beckn setup (fidedocker/onix-adapter:1.6.1, the Health* referral schemas). The CCE flows of OpenMRS (events to the
# HIE, care alerts from CCE) go through the Sygnal adapter next to them (k8s/beckn/onix: onix-sygnal), which also
# provides the Redis both use (onix-redis). Used by k8s/beckn/openmrs only.
#
# Not in this file, created by one-click-installer/lib/beckn/beckn-deploy.sh openmrs before this is applied:
#   Secret    onix-config         — onix-bap.yaml, onix-bpp.yaml (they hold the signing keys) and the four routing files,
#                                   rendered from k8s/beckn/onix-beckn/config/*.yaml, next to the Sygnal adapter's files
#   ConfigMap onix-schema         — the extra schema folders of the referral adapters: the CCE schemas (CceClinicalEvent
#                                   v1.0, CceCareAlert) and the Health* referral pack (k8s/beckn/onix-beckn/health-schema);
#                                   one key per file with "/" written "__". onix-sygnal holds no schemas (the CCE profile only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onix-bap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onix-bap
  template:
    metadata:
      labels:
        app: onix-bap
    spec:
      initContainers:
        # The adapter finds a local schema by its folder name (config/schema/<Name>/<version>/…). A ConfigMap is flat, so the
        # folders are rebuilt here from keys such as CceClinicalEvent__v1.0__attributes.yaml.
        - name: schema
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cd /in || exit 0
              for f in *; do
                [ -f "$f" ] || continue
                d="/out/$(echo "$f" | sed 's#__#/#g')"
                mkdir -p "$(dirname "$d")" && cp "$f" "$d"
              done
              find /out -type f | sort
          # Explicit and small: a namespace LimitRange would otherwise give this container its default request (200m CPU),
          # and a pod's request is at least that of its largest init container.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: schema-in
              mountPath: /in
            - name: schema
              mountPath: /out
      containers:
        - name: onix-bap
          image: fidedocker/onix-adapter:1.6.1
          args: ["./server", "--config=/app/config/onix-bap.yaml"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: schema
              mountPath: /app/config/schema
      volumes:
        - name: config
          secret:
            secretName: onix-config
        - name: schema-in
          configMap:
            name: onix-schema
        - name: schema
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onix-bap
spec:
  selector:
    app: onix-bap
  ports:
    - port: 8081
      targetPort: 8081
---
