# Grafana alert rules for the data pipeline (Grafana unified alerting, file provisioning).
# Mounted by grafana.yaml at /etc/grafana/provisioning/alerting. Datasource uids (postgresql, clickhouse, prometheus) are the
# ones provisioned by the grafana-datasources ConfigMap in grafana.yaml.
#
# Notifications: no contact point is provisioned, so firing alerts show under Alerting -> Alert rules in Grafana and are not
# sent anywhere. Add a contact point (and SMTP for Grafana) to deliver them.
#
# Each rule has a query node (A) with an explicit relativeTimeRange and a threshold node (C) that the condition points at;
# Grafana provisioning rejects a rule without them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  cce-pipeline-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: CCE Pipeline Alerts
        folder: CCE Data Pipeline
        interval: 1m
        rules:
          # ---- CDC liveness: Debezium is not consuming the replication slot ----------------------------------------
          - uid: cce-cdc-slot-inactive
            title: CDC Replication Slot Inactive
            condition: C
            for: 2m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: critical
            annotations:
              summary: "Debezium is not consuming the cce_analytics_slot replication slot: CDC to ClickHouse has stopped"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: postgresql
                model:
                  refId: A
                  datasource: { type: postgres, uid: postgresql }
                  rawSql: "SELECT count(*)::float8 AS value FROM pg_replication_slots WHERE slot_name = 'cce_analytics_slot' AND active = false"
                  format: table
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  conditions:
                    - type: query
                      evaluator: { type: gt, params: [0] }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { type: last, params: [] }

          # ---- CDC replication slot lag > 100 MB ---------------------------------------------------------------------
          - uid: cce-cdc-replication-lag
            title: CDC Replication Lag High
            condition: C
            for: 10m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "The cce_analytics_slot replication slot is more than 100 MB behind: ClickHouse is falling behind PostgreSQL"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: postgresql
                model:
                  refId: A
                  datasource: { type: postgres, uid: postgresql }
                  rawSql: "SELECT coalesce(pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn), 0)::float8 AS value FROM pg_replication_slots WHERE slot_name = 'cce_analytics_slot'"
                  format: table
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  conditions:
                    - type: query
                      evaluator: { type: gt, params: [104857600] }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { type: last, params: [] }

          # ---- ClickHouse disk usage > 85% (ClickHouse's own Prometheus endpoint, scraped on :9363) ---------------
          - uid: cce-clickhouse-disk-full
            title: ClickHouse Disk > 85%
            condition: C
            for: 5m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: critical
            annotations:
              summary: "ClickHouse's default disk is more than 85% full"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  datasource: { type: prometheus, uid: prometheus }
                  expr: "ClickHouseAsyncMetrics_DiskUsed_default / ClickHouseAsyncMetrics_DiskTotal_default * 100"
                  instant: true
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  conditions:
                    - type: query
                      evaluator: { type: gt, params: [85] }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { type: last, params: [] }

          # ---- Inbound events stopped ---------------------------------------------------------------------------------
          # Fires only when events arrived in the last 7 days but none in the last 4 hours, so a new or idle environment
          # stays quiet. 4 h matches the intelligence service's tier-1 ingestion-gap e-mail
          # (CCE_OPSALERT_TIER1_THRESHOLD_MINUTES=240). A gap here with events still reaching the collector points at CDC.
          - uid: cce-inbound-events-stopped
            title: Inbound Events Stopped
            condition: C
            for: 5m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "No inbound events reached ClickHouse in the last 4 hours, after events in the last 7 days (emitter, collector or CDC stopped)"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: clickhouse
                model:
                  refId: A
                  datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
                  editorType: sql
                  queryType: table
                  format: 1
                  rawSql: "SELECT toFloat64(countIf(received_at >= now() - INTERVAL 4 HOUR) = 0 AND count() > 0) AS value FROM cce_analytics.inbound_event_logs WHERE received_at >= now() - INTERVAL 7 DAY"
              - refId: C
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  datasource: { type: __expr__, uid: __expr__ }
                  expression: A
                  conditions:
                    - type: query
                      evaluator: { type: gt, params: [0] }
                      operator: { type: and }
                      query: { params: [C] }
                      reducer: { type: last, params: [] }
