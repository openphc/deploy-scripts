# CCE 2.0.0 — Step SLA replaces the retired 1.x cce-scheduler-service: sweeps
# step_sla_state_transition and records OVERDUE / MISSED. No Kafka, no DDL of its own (ddl-auto:
# validate against Matcher's schema). Replicas are safe side by side (FOR UPDATE SKIP LOCKED fetch),
# so no leader election and no special rollout strategy.
# Must NOT run while Matcher works through an event backlog (a replay, or its first start after the
# upgrade): it would judge steps whose completing event is still queued, and never revises a verdict.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cce-step-sla-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cce-step-sla-service
  template:
    metadata:
      labels:
        app: cce-step-sla-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8092"
    spec:
      containers:
        - name: cce-step-sla-service
          image: ghcr.io/openphc/cce-step-sla-service:latest
          ports:
            - containerPort: 8092
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8092"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_POOL_SIZE
              value: "3"
            # CCE_SLA_INSTANCE_ID is left unset: it defaults to HOSTNAME, the pod name, so each
            # replica gets its own id.
            - name: CCE_SLA_BATCH_SIZE
              value: "100"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus,metrics"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "cce-step-sla-service"
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cce-step-sla-service
spec:
  selector:
    app: cce-step-sla-service
  ports:
    - port: 8092
      targetPort: 8092
