apiVersion: apps/v1
kind: Deployment
metadata:
  name: cce-intelligence-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cce-intelligence-service
  template:
    metadata:
      labels:
        app: cce-intelligence-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: cce-intelligence-service
          # RI-63: deploys the demo-rw branch's build — a minimal, fresh service scoped to the
          # ops-alerting engine only (that repo's docs/architecture-overview.md). No clinical
          # FHIR pipeline here, unlike the demo/main branch's image, and schema is Flyway-managed
          # (that repo owns real migrations), not Hibernate `ddl-auto`. KAFKA_BOOTSTRAP_SERVERS
          # below is currently unused (no spring-kafka dependency on this branch) but kept wired.
          # Image tag below is an inert placeholder — the real deployed image is set by a manual
          # digest-based redeploy step outside this repo, not by this tag or kustomize's images:
          # transformer in the overlays.
          image: ghcr.io/openphc/cce-intelligence-service:release-1.0.0
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8085"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_POOL_SIZE
              value: "10"
            - name: DB_POOL_MIN_IDLE
              value: "5"
            # Flyway — this service's own migration, isolated from every other service sharing
            # this Postgres by a distinct history table name (that repo's V1 migration comment
            # explains why: without it, this service's V1 would collide with whichever other
            # service's V1 already occupies the default `flyway_schema_history` name).
            - name: SPRING_FLYWAY_TABLE
              value: "flyway_schema_history_intelligence"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "0"
            # SMTP — timeouts are load-bearing, not just tidy: a hung SMTP call would otherwise
            # hold the row lock (and DB connection) that makes concurrent replicas safe open
            # indefinitely (that repo's docs/flow-diagrams.md).
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_INTELLIGENCE_SMTP_HOST
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_INTELLIGENCE_SMTP_PORT
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_SMTP_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_SMTP_PASSWORD
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
              value: "true"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
              value: "true"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT
              value: "5000"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT
              value: "5000"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT
              value: "5000"
            # Tier recipients — named by tier position, not by whoever currently holds it, so a
            # future name/role change is a Secret value change here, never a rebuild (that
            # repo's docs/api-reference.md). Required, no default — the service fails to start
            # with a clear error naming whichever is missing. Each accepts one address or a
            # comma-separated list.
            - name: ALERT_EMAIL_TIER1
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_EMAIL_TIER1
            - name: ALERT_NAME_TIER1
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_NAME_TIER1
            - name: ALERT_EMAIL_TIER2
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_EMAIL_TIER2
            - name: ALERT_NAME_TIER2
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_NAME_TIER2
            - name: ALERT_EMAIL_TIER3
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_EMAIL_TIER3
            - name: ALERT_NAME_TIER3
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_INTELLIGENCE_ALERT_NAME_TIER3
            # Escalation-timing — required, no default (unlike _SUBJECT/_CC/POLL_INTERVAL below,
            # which stay optional), sourced exactly like the recipients above: a plain
            # configMapKeyRef, no extra validation in this repo. A missing one isn't caught here
            # — it's caught by the app itself the moment the pod starts. Unlike the recipients
            # (String fields, which need TierConfig's own explicit check because Spring accepts
            # any string without complaint), threshold-minutes is a `long` — Spring's own numeric
            # binding already rejects a missing/blank value with its own clear error naming the
            # exact property, value, and YAML line, no custom validation code needed on either
            # side (see that repo's api-reference.md). Set in Infisical.
            - name: CCE_OPSALERT_TIER1_THRESHOLD_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_OPSALERT_TIER1_THRESHOLD_MINUTES
            - name: CCE_OPSALERT_TIER2_THRESHOLD_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_OPSALERT_TIER2_THRESHOLD_MINUTES
            - name: CCE_OPSALERT_TIER3_THRESHOLD_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_OPSALERT_TIER3_THRESHOLD_MINUTES
            # Tier Cc — optional, safe to wire as a plain passthrough for all three tiers: every
            # tier's app-level default is the same, empty (no built-in escalation chain — see
            # that repo's api-reference.md for why that was deliberately removed), so an unset
            # value here resolves to the exact same "no cc" the app would pick anyway. In
            # cce-secrets, not cce-config, since a real value is people's email addresses.
            - name: CCE_OPSALERT_TIER1_CC
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_OPSALERT_TIER1_CC
            - name: CCE_OPSALERT_TIER2_CC
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_OPSALERT_TIER2_CC
            - name: CCE_OPSALERT_TIER3_CC
              valueFrom:
                secretKeyRef:
                  name: cce-secrets
                  key: CCE_OPSALERT_TIER3_CC
            # Kill switch on delivery only (OpsAlertProperties' javadoc) — required, no default,
            # wired exactly like the thresholds above: a plain configMapKeyRef, no envsubst
            # default needed since Infisical always has a value for it. Non-sensitive (just a
            # boolean), so cce-config rather than cce-secrets.
            - name: CCE_OPSALERT_NOTIFICATIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: CCE_OPSALERT_NOTIFICATIONS_ENABLED
            # Still deliberately NOT wired: CCE_OPSALERT_POLL_INTERVAL_MS and each tier's
            # _SUBJECT. These still have a non-empty app-level default (the PRD's own copy) — a
            # plain passthrough isn't safe for them: envsubst turns a genuinely-unset ${VAR} into
            # an empty string rather than leaving it absent, and Spring only falls back to its
            # own default when a property is entirely absent, not when it's present-but-empty.
            # Wiring one needs a `:=` default added to deploy-uat.sh/deploy-prod.sh first,
            # matching that app default, so envsubst never actually sees it unset.
            # Unused by the demo-rw branch's code today (no spring-kafka dependency) — kept
            # wired rather than removed, matching the other services here that do use it, so
            # nothing needs to change here if a Kafka dependency is ever reintroduced.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: cce-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus,metrics"
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "cce-intelligence-service"
            # Spring Boot's mail health indicator opens a live SMTP connection to Office365 on
            # every /actuator/health call — k8s probes hit that every ~10-15s, so it was taking
            # the whole liveness/readiness check down whenever that connection was slow, causing
            # kubelet to kill an otherwise-healthy pod. SMTP reachability isn't "is this pod
            # alive" — AlertEscalationEngine already retries a failed send on its own next tick.
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: "false"
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cce-intelligence-service
spec:
  selector:
    app: cce-intelligence-service
  ports:
    - port: 8085
      targetPort: 8085
